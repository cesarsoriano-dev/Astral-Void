[env]
TERM = "xterm-256color"

[window]
padding = { x = 16, y = 16 }
dynamic_padding = true
decorations = "None"
opacity = 0.78
blur = true
title = "Alacritty"
dynamic_title = true

[scrolling]
history = 10000
multiplier = 3

[font]
size = 11.5

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 500
blink_timeout = 15
unfocused_hollow = true

[selection]
save_to_clipboard = true

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "0x0a0816"
foreground = "0xf8f8f2"
dim_foreground = "0x6272a4"
bright_foreground = "0xffffff"

[colors.cursor]
text = "0x0a0816"
cursor = "0x8be9fd"

[colors.vi_mode_cursor]
text = "0x0a0816"
cursor = "0xbd93f9"

[colors.search.matches]
foreground = "0x0a0816"
background = "0xffb86c"

[colors.search.focused_match]
foreground = "0x0a0816"
background = "0xff79c6"

[colors.selection]
text = "0x0a0816"
background = "0xbd93f9"

[colors.normal]
black = "0x120e26"
red = "0xff5555"
green = "0x50fa7b"
yellow = "0xffb86c"
blue = "0xbd93f9"
magenta = "0xff79c6"
cyan = "0x8be9fd"
white = "0xf8f8f2"

[colors.bright]
black = "0x6272a4"
red = "0xff6e6e"
green = "0x69ff94"
yellow = "0xffffa5"
blue = "0xd6acff"
magenta = "0xff92df"
cyan = "0xa4ffff"
white = "0xffffff"
