format = """
[╭─](bold blue)\
[](fg:magenta)\
$os\
$username\
[](fg:magenta bg:blue)\
$directory\
[](fg:blue bg:black)\
$git_branch\
$git_status\
[](fg:black bg:cyan)\
$c\
$rust\
$golang\
$nodejs\
$python\
$docker_context\
[ ](fg:cyan)\
$cmd_duration\
$line_break\
[╰─](bold blue)$character"""

add_newline = true
command_timeout = 1000

[os]
disabled = false
style = "bg:magenta fg:black bold"

[os.symbols]
Arch = " 󰣇 "
CachyOS = " 󰣇 "
Linux = "  "
Ubuntu = "  "
Fedora = "  "
Debian = "  "

[username]
show_always = true
style_user = "bg:magenta fg:black bold"
style_root = "bg:red fg:black bold"
format = '[$user ]($style)'

[directory]
style = "bg:blue fg:black bold"
format = "[  $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documentos" = "󰈙 Docs"
"Documents" = "󰈙 Docs"
"Descargas" = "󰉍 Downloads"
"Downloads" = "󰉍 Downloads"
"Música" = "󰍙 Music"
"Music" = "󰍙 Music"
"Imágenes" = "󰉏 Pictures"
"Pictures" = "󰉏 Pictures"
"Proyectos" = "󰲋 Projects"
"Projects" = "󰲋 Projects"

[git_branch]
symbol = ""
style = "bg:black fg:green bold"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:black fg:yellow bold"
format = '[$all_status$ahead_behind ]($style)'

[nodejs]
symbol = ""
style = "bg:cyan fg:black bold"
format = '[ $symbol ($version) ]($style)'

[c]
symbol = " "
style = "bg:cyan fg:black bold"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:cyan fg:black bold"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = ""
style = "bg:cyan fg:black bold"
format = '[ $symbol ($version) ]($style)'

[python]
symbol = ""
style = "bg:cyan fg:black bold"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:cyan fg:black bold"
format = '[ $symbol $context ]($style)'

[cmd_duration]
min_time = 500
style = "fg:yellow bold"
format = "[󱎫 $duration]($style)"

[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
