term=xterm-256color
font=JetBrainsMono Nerd Font:size=11.5
pad=16x16 center
resize-delay-ms=100

[scrollback]
lines=10000
multiplier=3.0

[url]
launch=xdg-open ${url}
label-letters=sadfjklewcmpgh
osc8-underline=url-mode

[cursor]
style=beam
color=0a0816 8be9fd
blink=yes
beam-thickness=1.8

[mouse]
hide-when-typing=yes

[csd]
preferred=none

[colors]
alpha=0.78
background=0a0816
foreground=f8f8f2
flash=ffb86c
flash-alpha=0.5

regular0=120e26
regular1=ff5555
regular2=50fa7b
regular3=ffb86c
regular4=bd93f9
regular5=ff79c6
regular6=8be9fd
regular7=f8f8f2

bright0=6272a4
bright1=ff6e6e
bright2=69ff94
bright3=ffffa5
bright4=d6acff
bright5=ff92df
bright6=a4ffff
bright7=ffffff

selection-foreground=0a0816
selection-background=bd93f9
urls=8be9fd
