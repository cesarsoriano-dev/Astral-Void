font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

disable_ligatures never
cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

scrollback_lines 10000
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 2.0

url_color 0x8be9fd
url_style curly
open_url_with default
detect_urls yes

copy_on_select yes
strip_trailing_spaces smart

repaint_delay 8
input_delay 2
sync_to_monitor yes

enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes

window_padding_width 14
placement_strategy center
hide_window_decorations yes
confirm_os_window_close 0

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"

background_opacity 0.78
dynamic_background_opacity yes

foreground              0xf8f8f2
background              0x0a0816
selection_foreground    0x0a0816
selection_background    0xbd93f9

cursor                  0x8be9fd
cursor_text_color       0x0a0816

active_border_color     0xbd93f9
inactive_border_color   0x6272a4
bell_border_color       0xff5555

active_tab_foreground   0x0a0816
active_tab_background   0xbd93f9
active_tab_font_style   bold
inactive_tab_foreground 0xf8f8f2
inactive_tab_background 0x120e26
inactive_tab_font_style normal
tab_bar_background      0x0a0816

color0  0x120e26
color8  0x6272a4

color1  0xff5555
color9  0xff6e6e

color2  0x50fa7b
color10 0x69ff94

color3  0xffb86c
color11 0xffffa5

color4  0xbd93f9
color12 0xd6acff

color5  0xff79c6
color13 0xff92df

color6  0x8be9fd
color14 0xa4ffff

color7  0xf8f8f2
color15 0xffffff
