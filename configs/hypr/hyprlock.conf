general {
    disable_loading_bar = false
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = true
    immediate_render = true
    pam_module = hyprlock
    text_trim = true
}

background {
    monitor =
    path = $HOME/.cache/hyde/wall.set
    color = rgba(10, 8, 22, 1.0)
    blur_passes = 3
    blur_size = 8
    noise = 0.015
    contrast = 1.08
    brightness = 0.58
    vibrancy = 0.25
    vibrancy_darkness = 0.35
}

shape {
    monitor =
    size = 380, 44
    color = rgba(10, 8, 22, 0.82)
    rounding = -1
    border_size = 1
    border_color = rgba(189, 147, 249, 0.38)
    rotate = 0
    xray = false
    position = 0, 355
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.75)
}

label {
    monitor =
    text = cmd[update:1000] LC_TIME=C date +"󰃭  %A, %d %B %Y"
    color = rgba(139, 233, 253, 1.0)
    font_size = 13
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 355
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.85)
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(248, 248, 242, 1.0)
    font_size = 92
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 230
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.90)
}

label {
    monitor =
    text = 🌌  A S T R A L   V O I D   H O R I Z O N
    color = rgba(189, 147, 249, 0.95)
    font_size = 11
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 135
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.90)
}

image {
    monitor =
    path = $HOME/.cache/hyde/astral_void_logo.png
    size = 150
    rounding = -1
    border_size = 3
    border_color = rgba(189, 147, 249, 0.85) rgba(139, 233, 253, 0.85) 45deg
    rotate = 0
    reload_time = 2
    position = 0, -5
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(0, 0, 0, 0.85)
}

shape {
    monitor =
    size = 240, 38
    color = rgba(10, 8, 22, 0.84)
    rounding = -1
    border_size = 1
    border_color = rgba(139, 233, 253, 0.35)
    rotate = 0
    xray = false
    position = 0, -125
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.75)
}

label {
    monitor =
    text =    $USER
    color = rgba(248, 248, 242, 1.0)
    font_size = 13
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -125
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.85)
}

input-field {
    monitor =
    size = 340, 52
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.32
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(189, 147, 249, 0.75) rgba(139, 233, 253, 0.75) 45deg
    inner_color = rgba(10, 8, 22, 0.88)
    font_color = rgba(248, 248, 242, 1.0)
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <span foreground="rgba(139, 233, 253, 0.85)" weight="bold">󰌾  Introducir Clave Estelar...</span>
    hide_input = false
    rounding = -1
    check_color = rgba(80, 250, 123, 0.95) rgba(139, 233, 253, 0.95) 45deg
    fail_color = rgba(255, 85, 85, 0.95) rgba(255, 121, 198, 0.95) 45deg
    fail_text = <span foreground="rgba(255, 85, 85, 1.0)" weight="bold">  Acceso Denegado ($ATTEMPTS)</span>
    capslock_color = rgba(255, 184, 108, 0.95)
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -195
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.85)
}

shape {
    monitor =
    size = 460, 42
    color = rgba(10, 8, 22, 0.84)
    rounding = -1
    border_size = 1
    border_color = rgba(189, 147, 249, 0.32)
    rotate = 0
    xray = false
    position = 0, 38
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.80)
}

label {
    monitor =
    text = cmd[update:5000] bat=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n 1); if [ -n "$bat" ]; then echo "  Hyprland   │   󰁹 Batería: ${bat}%   │   󰌾 Bloqueado"; else echo "  Hyprland   │   󰚥 Energía AC   │   󰌾 Bloqueado"; fi
    color = rgba(248, 248, 242, 0.92)
    font_size = 11
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 49
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.85)
}
